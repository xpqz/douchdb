name: douchdb-demo

x-douchdb: &douchdb
  build: .
  image: douchdb:local
  restart: unless-stopped
  environment:
    DOUCHDB_CLUSTER_SECRET: ${DOUCHDB_CLUSTER_SECRET:-dev-cluster-secret-please-change}
    # Keep the demo responsive; production defaults are 60s/5s.
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_BSP_SCHEDULE_DELAY: "1000"
  depends_on:
    - otel-lgtm

services:
  node0:
    <<: *douchdb
    command:
      - --listen
      - 0.0.0.0:5984
      - --data
      - /data
      - --q
      - "4"
      - --n
      - "2"
      - --admin
      - admin:secret
      - --nodes
      - http://node0:5984,http://node1:5984,http://node2:5984
      - --me
      - "0"
      - --sync-secs
      - "3"
      - --otel-endpoint
      - http://otel-lgtm:4318
    ports:
      - "5984:5984"
    volumes:
      - node0-data:/data

  node1:
    <<: *douchdb
    command:
      - --listen
      - 0.0.0.0:5984
      - --data
      - /data
      - --q
      - "4"
      - --n
      - "2"
      - --admin
      - admin:secret
      - --nodes
      - http://node0:5984,http://node1:5984,http://node2:5984
      - --me
      - "1"
      - --sync-secs
      - "3"
      - --otel-endpoint
      - http://otel-lgtm:4318
    ports:
      - "5985:5984"
    volumes:
      - node1-data:/data

  node2:
    <<: *douchdb
    command:
      - --listen
      - 0.0.0.0:5984
      - --data
      - /data
      - --q
      - "4"
      - --n
      - "2"
      - --admin
      - admin:secret
      - --nodes
      - http://node0:5984,http://node1:5984,http://node2:5984
      - --me
      - "2"
      - --sync-secs
      - "3"
      - --otel-endpoint
      - http://otel-lgtm:4318
    ports:
      - "5986:5984"
    volumes:
      - node2-data:/data

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - node0
      - node1
      - node2
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  node0-data:
  node1-data:
  node2-data:
