name: douchdb-demo

x-douchdb: &douchdb
  build: .
  image: douchdb:local
  restart: unless-stopped
  environment:
    # The secrets have no defaults: a published default would be a working
    # credential on every default install. Put them in `.env` (see
    # docs/docker.md for a generator) or export them before `docker compose up`.
    # They are passed in the environment, not on the command line, so they do
    # not show up in `ps` or `docker inspect` argv.
    DOUCHDB_CLUSTER_SECRET: ${DOUCHDB_CLUSTER_SECRET:?set DOUCHDB_CLUSTER_SECRET, see docs/docker.md}
    # Session cookies must verify on every node behind the proxy, so all nodes
    # share one key. It is deliberately not derived from the cluster secret.
    DOUCHDB_SESSION_SECRET: ${DOUCHDB_SESSION_SECRET:?set DOUCHDB_SESSION_SECRET, see docs/docker.md}
    # Server admin as user:password.
    DOUCHDB_ADMIN: ${DOUCHDB_ADMIN:?set DOUCHDB_ADMIN (user:password), see docs/docker.md}
    # Keep the demo responsive; production defaults are 60s/5s.
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_BSP_SCHEDULE_DELAY: "1000"
  depends_on:
    - otel-lgtm

services:
  node0:
    <<: *douchdb
    command:
      - --listen
      - 0.0.0.0:5984
      - --data
      - /data
      - --q
      - "4"
      - --n
      - "3"
      - --nodes
      - http://node0:5984,http://node1:5984,http://node2:5984
      - --me
      - "0"
      - --sync-secs
      - "3"
      - --otel-endpoint
      - http://otel-lgtm:4318
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - node0-data:/data

  node1:
    <<: *douchdb
    command:
      - --listen
      - 0.0.0.0:5984
      - --data
      - /data
      - --q
      - "4"
      - --n
      - "3"
      - --nodes
      - http://node0:5984,http://node1:5984,http://node2:5984
      - --me
      - "1"
      - --sync-secs
      - "3"
      - --otel-endpoint
      - http://otel-lgtm:4318
    ports:
      - "127.0.0.1:5985:5984"
    volumes:
      - node1-data:/data

  node2:
    <<: *douchdb
    command:
      - --listen
      - 0.0.0.0:5984
      - --data
      - /data
      - --q
      - "4"
      - --n
      - "3"
      - --nodes
      - http://node0:5984,http://node1:5984,http://node2:5984
      - --me
      - "2"
      - --sync-secs
      - "3"
      - --otel-endpoint
      - http://otel-lgtm:4318
    ports:
      - "127.0.0.1:5986:5984"
    volumes:
      - node2-data:/data

  proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    depends_on:
      - node0
      - node1
      - node2
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD, see docs/docker.md}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana-dashboards/douchdb-overview.json
    volumes:
      - ./docker/grafana/dashboards:/otel-lgtm/grafana-dashboards:ro
      - ./docker/grafana/provisioning/dashboards/douchdb.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/douchdb.yaml:ro

volumes:
  node0-data:
  node1-data:
  node2-data:
