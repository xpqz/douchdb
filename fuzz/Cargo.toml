[package]
name = "douchdb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
md-5 = "0.10"

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etf"
path = "fuzz_targets/etf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "revtree"
path = "fuzz_targets/revtree.rs"
test = false
doc = false
bench = false
