name: Nightly differential

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-differential
  cancel-in-progress: false

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python syntax
        run: python3 -m py_compile differential/*.py
      - name: Build fuzzer image
        run: docker build -t douchdb:differential .
      - name: CRUD seeds
        run: |
          for seed in $(seq 1 10); do
            echo "::group::CRUD seed $seed"
            python3 differential/run.py --seed "$seed" --steps 500 --skip-build
            echo "::endgroup::"
          done
      - name: Multi-document seeds
        run: |
          for seed in $(seq 1 10); do
            echo "::group::multi seed $seed"
            python3 differential/run.py --multi --seed "$seed" --multi-steps 400 --skip-build
            echo "::endgroup::"
          done
      - name: View seeds
        run: |
          for seed in $(seq 1 10); do
            echo "::group::views seed $seed"
            python3 differential/run.py --views --seed "$seed" --view-queries 500 --skip-build
            echo "::endgroup::"
          done
      - name: View freshness seeds
        run: |
          for seed in $(seq 1 5); do
            echo "::group::views-live seed $seed"
            python3 differential/run.py --views --view-mutations 50 --view-queries 200 --seed "$seed" --skip-build
            echo "::endgroup::"
          done
      - name: Conflict seeds
        run: |
          for seed in $(seq 1 10); do
            echo "::group::conflicts seed $seed"
            python3 differential/run.py --conflicts --seed "$seed" --conflict-rounds 100 --skip-build
            echo "::endgroup::"
          done
      - name: Changes pagination
        run: python3 differential/run.py --changes --skip-build
      - name: Upload differential artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-differential-artifacts
          path: differential/artifacts/
          if-no-files-found: ignore

      - name: Install nightly and cargo-fuzz
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly branch, 2026-11
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz JSON, ETF and revision trees
        run: |
          cd fuzz
          cargo +nightly fuzz run json -- -runs=5000
          cargo +nightly fuzz run etf -- -runs=5000
          cargo +nightly fuzz run revtree -- -runs=5000
