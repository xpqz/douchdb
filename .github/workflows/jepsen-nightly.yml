name: Nightly Jepsen

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-jepsen
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No-fault smoke
        run: |
          ./jepsen-clj/run.sh --no-nemesis --time-limit 30 \
            --seed 1001 --liveness-interval-ms 500
      - name: Kill/restart soak
        run: |
          ./jepsen-clj/run.sh --fault kill --time-limit 600 \
            --seed 2001 --nemesis-interval 10 --liveness-interval-ms 500
      - name: Network partition soak
        run: |
          ./jepsen-clj/run.sh --fault partition --time-limit 600 \
            --seed 2002 --nemesis-interval 10 --liveness-interval-ms 500
      # Jepsen names run directories by timestamp, with colons that
      # upload-artifact rejects, so upload one archive instead.
      - name: Pack Jepsen results
        if: always()
        run: |
          dirs=$(cd jepsen-clj && ls -d store logs 2>/dev/null || true)
          if [ -n "$dirs" ]; then
            tar -czf jepsen-nightly-results.tgz -C jepsen-clj $dirs
          fi
      - name: Upload Jepsen results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jepsen-nightly-results
          path: jepsen-nightly-results.tgz
          if-no-files-found: ignore
