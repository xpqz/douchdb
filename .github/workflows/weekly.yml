name: Weekly deep run

# The slower checks that the per-PR workflow (ci.yml) leaves out: the WASM
# sandbox (wasmi and the wasmtime backend) together with the native and process
# sandboxes, the PouchDB client suite and a headless-Chromium PouchDB sync
# across origins (real CORS). Also runnable on demand from the
# Actions tab. The CouchDB differential fuzzing is not repeated here: it runs
# nightly in nightly.yml.
on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-deep-run
  cancel-in-progress: false

jobs:
  sandboxes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Every JS sandbox mode: `process` needs Linux (seccomp/Landlock) and
      # `wasm` needs the wasm feature, which --features wasmtime includes.
      DOUCHDB_TEST_JS_SANDBOXES: native,process,wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy with wasmtime
        run: cargo clippy --all-targets --features wasmtime -- -D warnings
      - name: Tests with wasmtime and every sandbox
        run: cargo test --features wasmtime
      - name: No stray test servers
        run: |
          if pgrep -fa 'target/debug/douchdb'; then
            echo "test servers still running after cargo test" >&2
            exit 1
          fi

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/pouchdb/package-lock.json
      - name: Build douchdb image
        run: docker build -t douchdb:clients .
      - name: Start douchdb
        run: |
          docker run -d --name douchdb-clients -p 127.0.0.1:25985:5984 douchdb:clients \
            --listen 0.0.0.0:5984 --data /data
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:25985/ >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          docker logs douchdb-clients
          exit 1
      - name: PouchDB 9 client compatibility
        run: |
          cd clients/pouchdb
          npm ci
          node run.js http://127.0.0.1:25985
      - name: Server logs on failure
        if: failure()
        run: docker logs douchdb-clients || true
      - name: Stop douchdb
        if: always()
        run: docker rm -f douchdb-clients || true

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build douchdb image
        run: docker build -t douchdb:browser .
      - name: Start douchdb with CORS for the test page origin
        run: |
          # Published on all interfaces: the Playwright container reaches it
          # through host.docker.internal, not through the loopback address.
          docker run -d --name douchdb-browser -p 25986:5984 douchdb:browser \
            --listen 0.0.0.0:5984 --data /data --admin admin:pass \
            --cors-origins http://127.0.0.1:8099 --cors-credentials
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:25986/ >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          docker logs douchdb-browser
          exit 1
      - name: Browser PouchDB 9 sync (Chromium, cross-origin)
        run: clients/pouchdb/run-browser.sh http://host.docker.internal:25986 admin:pass
      - name: Server logs on failure
        if: failure()
        run: docker logs douchdb-browser || true
      - name: Stop douchdb
        if: always()
        run: docker rm -f douchdb-browser || true
