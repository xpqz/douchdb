name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Unit and integration tests
        run: cargo test
      - name: Wasmtime backend tests
        run: cargo test --features wasmtime
      # Temporary vendored patch; remove with the rest of vendor/ per
      # docs/storage-dependency.md (issue #105).
      - name: Vendored storage cache tests
        run: cargo test --manifest-path vendor/rusty-leveldb/Cargo.toml cache::

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and integration tests
        run: cargo test --locked

  docker-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t douchdb:ci-amd64 .

  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 container
        run: docker buildx build --platform linux/arm64 --load -t douchdb:ci-arm64 .
