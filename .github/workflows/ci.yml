name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs the native and process (seccomp/Landlock, x86_64) QuickJS sandboxes.
# The WASM sandbox tests (including the wasmtime backend) are not run here; run them locally with
# `cargo test` and `cargo test --features wasmtime`.
env:
  DOUCHDB_TEST_JS_SANDBOXES: native,process

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test
      # Servers started by the test suites must not outlive them (issue #119).
      - name: No stray test servers
        run: |
          if pgrep -fa 'target/debug/douchdb'; then
            echo "test servers still running after cargo test" >&2
            exit 1
          fi
      - name: Storage corruption and fail-closed checks
        run: |
          cargo build --release --locked
          python3 scripts/storage_faults.py --bin target/release/douchdb
      - name: Critical-path mutation smoke
        run: python3 scripts/mutation_smoke.py
      # Temporary vendored patch; remove with the rest of vendor/ per
      # docs/storage-dependency.md (issue #105).
      - name: Vendored storage tests
        run: "cargo test --manifest-path vendor/rusty-leveldb/Cargo.toml"
      - name: Jepsen harness syntax
        run: python3 -m py_compile jepsen/*.py
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: Jepsen Clojure harness compiles
        run: |
          docker run --rm \
            -v "$PWD/jepsen-clj:/work" \
            -w /work \
            clojure:tools-deps-bookworm \
            clojure -M -e "(require 'douchdb.core)"

  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile differential/*.py
      - name: Build fuzzer image
        run: docker build -t douchdb:differential .
      - name: Differential CRUD
        run: |
          python3 differential/run.py --seed 1 --steps 120 --skip-build
          python3 differential/run.py --seed 2 --steps 120 --skip-build
      - name: Differential multi-document
        run: |
          python3 differential/run.py --multi --seed 1 --multi-steps 150 --skip-build
          python3 differential/run.py --multi --seed 2 --multi-steps 150 --skip-build
      - name: Differential views
        run: |
          python3 differential/run.py --views --seed 1 --view-queries 100 --skip-build
          python3 differential/run.py --views --seed 2 --view-queries 100 --skip-build
          python3 differential/run.py --views --view-mutations 10 --view-queries 50 --seed 3 --skip-build
      - name: Differential conflicts
        run: |
          python3 differential/run.py --conflicts --seed 1 --conflict-rounds 10 --skip-build
          python3 differential/run.py --conflicts --seed 2 --conflict-rounds 10 --skip-build
      - name: Differential changes pagination
        run: python3 differential/run.py --changes --skip-build
      - name: Upload differential artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-artifacts
          path: differential/artifacts/
          if-no-files-found: ignore

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/pouchdb/package-lock.json
      - name: Build douchdb image
        run: docker build -t douchdb:clients .
      - name: Start douchdb
        run: |
          docker run -d --name douchdb-clients -p 127.0.0.1:25985:5984 douchdb:clients \
            --listen 0.0.0.0:5984 --data /data
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:25985/ >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          docker logs douchdb-clients
          exit 1
      - name: PouchDB 9 client compatibility
        run: |
          cd clients/pouchdb
          npm ci
          node run.js http://127.0.0.1:25985
      - name: Server logs on failure
        if: failure()
        run: docker logs douchdb-clients || true
      - name: Stop douchdb
        if: always()
        run: docker rm -f douchdb-clients || true
