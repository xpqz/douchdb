# Same-origin front for the embedded console and a load balancer for the API.
# Any node can coordinate a request, so round-robin gives every node equal
# standing. The browser talks to http://localhost:8080, which keeps the
# AuthSession cookie first-party and lets streaming changes work.
upstream douchdb {
    least_conn;

    server node0:5984 max_fails=2 fail_timeout=5s;
    server node1:5984 max_fails=2 fail_timeout=5s;
    server node2:5984 max_fails=2 fail_timeout=5s;

    keepalive 64;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    location / {
        proxy_pass http://douchdb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Changes feeds and event-source responses must stream.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # A dead node should not fail an idempotent request. Nginx does not
        # retry non-idempotent methods unless explicitly configured, so writes
        # are not replayed by the proxy.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
