# Same-origin front for the embedded console. The browser talks to
# http://localhost:8080/_utils/, so fetch() uses that origin and every API call
# is proxied to node0. Cookies stay first-party and streaming changes work.
server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    location / {
        proxy_pass http://node0:5984;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
