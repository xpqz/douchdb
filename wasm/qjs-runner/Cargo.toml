[package]
name = "qjs-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
rquickjs = { version = "0.14", features = ["full-wasi"] }
# preserve_order, as in the host: an emitted object keeps its key order.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
