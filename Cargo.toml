[package]
name = "douchdb"
version = "0.0.1"
edition = "2021"
description = "CouchDB wire-compatible document database on LevelDB"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
hmac = "0.12"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
# preserve_order is load-bearing: CouchDB's rev hash depends on JSON key order.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rquickjs = "0.14"
icu_collator = "2.4"
icu_locale_core = "2.4"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["compression-gzip"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"
