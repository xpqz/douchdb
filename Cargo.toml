[package]
name = "douchdb"
version = "0.2.6"
edition = "2021"
description = "CouchDB wire-compatible document database on redb"
license = "Apache-2.0"
authors = ["Stefan Kruger"]

[lints.clippy]
# Every unsafe block states why it is sound.
undocumented_unsafe_blocks = "deny"

[features]
default = ["wasm"]
# The wasmi-based `--js-sandbox wasm`. Without it the build drops wasmi,
# wasmi_wasi and their wasi-common/witx/wast dependency tree.
wasm = ["dep:wasmi", "dep:wasmi_wasi"]
# Optional Cranelift JIT backend for --js-sandbox wasm (much faster than wasmi).
wasmtime = ["wasm", "dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
hmac = "0.12"
getrandom = "0.3"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "http2"] }
# The node listener runs hyper-util's HTTP/1 + HTTP/2 connection builder
# itself (axum::serve cannot set HTTP/2 window sizes or stream limits).
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
hyper = { version = "1", default-features = false }
sha2 = "0.10"
# Durable storage engine (docs/superpowers/specs/2026-11-16-redb-storage-design.md).
redb = "4.6"
# Per-value checksums on every stored redb value (kv::seal).
crc32c = "0.6"
serde = { version = "1", features = ["derive", "rc"] }
# preserve_order is load-bearing: CouchDB's rev hash depends on JSON key order.
# arbitrary_precision keeps integers beyond i64/u64 exact, including rev hashes.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
rquickjs = "0.14"
icu_collator = "2.4"
icu_locale_core = "2.4"
async-stream = "0.3"
tantivy = "0.27"
libc = "0.2"
wasmi = { version = "2.0", optional = true }
wasmi_wasi = { version = "2.0", optional = true }
# Wasmtime 50 needs Rust 1.97+; the default wasmi build does not.
wasmtime = { version = "50.0.1", optional = true }
wasmtime-wasi = { version = "50.0.1", optional = true, features = ["p1"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tower-layer = "0.3"
tower-service = "0.3"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

[dev-dependencies]
proptest = "1"
# Paused time, for tests of timeouts that must not wait on the clock.
tokio = { version = "1", features = ["test-util"] }

# The wasmi interpreter is orders of magnitude slower unoptimised, which makes
# the sandbox tests that run a large view or index through the runner take
# minutes. Optimise it (and only it) in dev and test builds.
[profile.dev.package.wasmi]
opt-level = 1
[profile.dev.package.wasmi_core]
opt-level = 1
[profile.dev.package.wasmi_ir]
opt-level = 1
[profile.dev.package.wasmi_collections]
opt-level = 1

# redb's debug assertions walk every page of a cleanly closed file on open
# (`mark_allocated_page_for_debug`), so a debug build cannot show that a
# verified reopen skips the full read (kv::tests). Release builds never do it.
[profile.dev.package.redb]
debug-assertions = false
